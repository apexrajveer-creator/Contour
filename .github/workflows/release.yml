name: Release

# Push a tag like v1.0.0 and this builds the Windows installer and attaches it to a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Build and publish (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Contour ${{ github.ref_name }}
          releaseBody: |
            ## Download
            **Windows:** `Contour_*_x64-setup.exe` below. The installer downloads the core models (~890 MB) once.

            Not code-signed yet: if SmartScreen warns, choose **More info → Run anyway**.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
