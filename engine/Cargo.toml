[package]
name = "contour-engine"
version = "1.0.0"
edition = "2024"
description = "On-device music source separation engine (MDX-Net + HT-Demucs on ONNX Runtime)"
license = "MIT"

[[bin]]
name = "contour-cli"
path = "src/bin/contour.rs"

[dependencies]
anyhow = "1.0.104"
flacenc = "0.5.1"
hex = "0.4.3"
num_cpus = "1"
hound = "3.5.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
realfft = "3.5.0"
rubato = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = "2"

# ONNX Runtime prebuilt binaries differ per platform: Windows builds always include DirectML,
# Apple Silicon builds always include CoreML. CUDA is opt-in (NVIDIA, Linux/Windows).
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }

[features]
default = []
cuda = ["ort/cuda", "ort/tensorrt", "ort/nvrtx"]

[build-dependencies]
cc = "1"
